<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Chỉ Dẫn Lối Đi · Aurora Grand Hotel</title>
  <link rel="icon" href="/hcrobot-icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #EFECE6;
      color: #1C1917;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* === BỐ CỤC TOÀN MÀN HÌNH CHUẨN GOOGLE MAPS === */
    #mainContent {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #FAF8F5 0%, #EFECE6 75%, #E5E0D5 100%);
    }

    /* 1. Lớp Bản Đồ Toàn Màn Hình (Chiếm 100% diện tích) */
    .map-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      overflow: hidden;
    }
    .map-canvas:active {
      cursor: grabbing;
    }
    .map-3d-stage {
      width: 100%;
      height: 100%;
      transform-origin: 50% 52%;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .map-3d-stage.tilt-3d {
      transform: perspective(1200px) rotateX(20deg) scale(1.03);
    }
    #mainMapSvg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #svgWorldGroup {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 2. Thanh Điều Hướng Nổi Nhỏ Gọn Phía Trên (Google Maps Top Pill) */
    .top-floating-card {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 10px;
      right: 10px;
      max-width: 520px;
      margin: 0 auto;
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(227, 223, 213, 0.95);
      border-radius: 16px;
      padding: 9px 11px;
      box-shadow: 0 6px 22px rgba(28, 25, 23, 0.10);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .top-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dest-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .nav-turn-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #1C1917;
      color: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .dest-title-wrap {
      min-width: 0;
      flex: 1;
    }
    .dest-meta-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #78716C;
    }
    .dest-name-main {
      font-size: 13.5px;
      font-weight: 800;
      color: #1C1917;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    /* Nút Switch Chặng Siêu Nhỏ Gọn (Chuẩn Google Pill Switch) */
    .compact-step-switch {
      display: inline-flex;
      align-items: center;
      background: #EFECE6;
      border: 1px solid #E3DFD5;
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }
    .compact-step-btn {
      border: none;
      background: transparent;
      color: #57534E;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .compact-step-btn.active {
      background: #1C1917;
      color: #FAF8F5;
      box-shadow: 0 2px 5px rgba(28, 25, 23, 0.18);
    }

    .top-row-instruction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 5px;
      border-top: 1px solid #F0EDE6;
      font-size: 11.5px;
      font-weight: 600;
      color: #292524;
      line-height: 1.35;
    }

    /* 3. Cụm Nút Nổi Nhỏ Gọn Bên Phải (Google Maps Circular FABs 36px) */
    .right-map-controls {
      position: absolute;
      right: 10px;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .gm-fab {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(227, 223, 213, 0.95);
      background: rgba(255, 255, 255, 0.96);
      color: #1C1917;
      box-shadow: 0 3px 12px rgba(28, 25, 23, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      padding: 0;
    }
    .gm-fab:active {
      transform: scale(0.93);
    }
    .gm-fab.active {
      background: #1C1917;
      color: #FAF8F5;
      border-color: #1C1917;
    }
    .gm-fab-sub {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: -0.2px;
      margin-top: 1px;
    }
    .gm-zoom-group {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(227, 223, 213, 0.95);
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(28, 25, 23, 0.12);
      overflow: hidden;
    }
    .gm-zoom-btn {
      width: 36px;
      height: 33px;
      border: none;
      background: transparent;
      color: #1C1917;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gm-zoom-btn:first-child {
      border-bottom: 1px solid #EFECE6;
    }
    .gm-zoom-btn:active {
      background: #EFECE6;
    }

    /* 4. Thanh Nổi Đáy Màn Hình Tối Giản (Google Maps Bottom Pill) */
    .bottom-floating-bar {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 10px;
      right: 10px;
      max-width: 520px;
      margin: 0 auto;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(227, 223, 213, 0.95);
      border-radius: 999px;
      padding: 6px 8px 6px 14px;
      box-shadow: 0 6px 24px rgba(28, 25, 23, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .bottom-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 11px;
      font-weight: 700;
      color: #57534E;
      white-space: nowrap;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #16A34A;
      animation: pulse 1.6s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .pill-next-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: none;
      background: #1C1917;
      color: #FAF8F5;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .pill-next-btn:active {
      transform: scale(0.96);
    }
    .pill-close-btn {
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid #E3DFD5;
      background: #EFECE6;
      color: #1C1917;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .pill-close-btn:active {
      transform: scale(0.96);
    }

    /* Modal Hết Hạn / Đã Đóng */
    #expiredScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #FAF8F5;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .expired-card {
      background: #FFFFFF;
      border: 1px solid #E3DFD5;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 40px rgba(28, 25, 23, 0.08);
    }
    .expired-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #F8F6F1;
      border: 1.5px solid #E3DFD5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1C1917;
      font-size: 24px;
    }

    /* Animation đường lộ trình dash & radar */
    .route-path {
      stroke-dasharray: 14 10;
      animation: dashMove 1.1s linear infinite;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -48;
      }
    }
    .radar-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: radarPulse 2s ease-out infinite;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.8); opacity: 0.75; }
      100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Giao Diện Bản Đồ Toàn Màn Hình Chuẩn Google Maps -->
  <div id="mainContent">
    <!-- 1. Thanh Điều Hướng Nhỏ Gọn Phía Trên -->
    <div class="top-floating-card">
      <div class="top-row-main">
        <div class="dest-info">
          <div class="nav-turn-badge" id="currentStepIcon">1</div>
          <div class="dest-title-wrap">
            <div class="dest-meta-line">
              <span id="floorBadge">TẦNG TRỆT</span>
              <span>·</span>
              <span id="destFloorBadge">TẦNG 5</span>
            </div>
            <div id="destNameHeader" class="dest-name-main">Đang nạp chỉ dẫn...</div>
          </div>
        </div>

        <!-- Nút Switch Chặng Nhỏ Gọn -->
        <div class="compact-step-switch" id="stepSwitcher">
          <button id="btnStep1" class="compact-step-btn active" onclick="switchStep(1)">Chặng 1</button>
          <button id="btnStep2" class="compact-step-btn" onclick="switchStep(2)">Chặng 2</button>
        </div>
      </div>

      <div class="top-row-instruction">
        <span id="stepInstructionText">Đi từ sảnh Lobby đến Thang máy A và bấm lên tầng mục tiêu.</span>
      </div>
    </div>

    <!-- 2. Bản Đồ Toàn Màn Hình (SVG ViewBox + Orthogonal Rotation Không Bao Giờ Méo) -->
    <div class="map-canvas" id="mapContainer">
      <div class="map-3d-stage" id="map3dStage">
        <svg id="mainMapSvg" viewBox="0 0 1840 1174" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="archGrid" width="60" height="60" patternUnits="userSpaceOnUse">
              <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(28,25,23,0.045)" stroke-width="1.5" />
            </pattern>
            <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
              <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.45" />
            </filter>
            <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1C1917" flood-opacity="0.26" />
            </filter>
            <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1C1917" flood-opacity="0.11" />
            </filter>
          </defs>

          <!-- Nền lưới kiến trúc rộng vô tận để khi xoay/kéo không bao giờ thấy viền cụt -->
          <rect x="-3000" y="-3000" width="8000" height="8000" fill="url(#archGrid)" />

          <!-- Nhóm Thế Giới Bản Đồ (Xoay chuẩn vuông góc 90 độ ngay trong hệ tọa độ 1:1 của SVG -> Không bao giờ méo) -->
          <g id="svgWorldGroup">
            <rect x="0" y="0" width="1840" height="1174" rx="22" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="4" filter="url(#boardShadow)" />
            <image id="floorImage" href="/maps/floor_1.png" x="0" y="0" width="1840" height="1174" preserveAspectRatio="none" />

            <!-- Lớp 1: Đường phát quang nền -->
            <path id="svgHalo" d="" fill="none" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.28" filter="url(#glow)" />
            <!-- Lớp 2: Đường ray nền sáng -->
            <path id="svgTrack" d="" fill="none" stroke="#E0F2FE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
            <!-- Lớp 3: Tuyến đường nét đứt chuyển động theo hướng đi -->
            <path id="svgRoute" class="route-path" d="" fill="none" stroke="#0284C7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Hạt dẫn đường chuyển động dọc theo lộ trình -->
            <g id="walkerGroup">
              <circle r="14" fill="#0EA5E9" opacity="0.24" />
              <circle r="8.5" fill="#1C1917" stroke="#FFFFFF" stroke-width="2.5" />
              <path d="M -2.5 -3 L 4 0 L -2.5 3 Z" fill="#FAF8F5" />
              <animateMotion id="walkerMotion" dur="3.4s" repeatCount="indefinite" rotate="auto" path="M 350 580 L 1715 560" />
            </g>

            <!-- Điểm xuất phát + Nhãn nổi nhỏ gọn tự cân bằng góc xoay -->
            <g id="startPinGroup" transform="translate(350, 580)">
              <circle class="radar-ring" r="18" fill="none" stroke="#1C1917" stroke-width="2.5" />
              <circle r="10.5" fill="#1C1917" stroke="#FFFFFF" stroke-width="3" filter="url(#pinShadow)" />
              <g id="startLabelInner">
                <rect x="-56" y="-38" width="112" height="22" rx="11" fill="#1C1917" stroke="#FAF8F5" stroke-width="1.8" filter="url(#pinShadow)" />
                <text id="startLabelText" x="0" y="-23" text-anchor="middle" fill="#FAF8F5" font-size="10.5" font-weight="800" font-family="-apple-system, sans-serif">BẠN Ở ĐÂY</text>
              </g>
            </g>

            <!-- Điểm kết thúc + Nhãn nổi nhỏ gọn tự cân bằng góc xoay -->
            <g id="destPinGroup" transform="translate(1715, 560)">
              <circle class="radar-ring" r="20" fill="none" stroke="#0284C7" stroke-width="3" />
              <circle r="11.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" filter="url(#pinShadow)" />
              <circle r="4" fill="#FFFFFF" />
              <g id="destLabelInner">
                <rect x="-72" y="-40" width="144" height="24" rx="12" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" filter="url(#pinShadow)" />
                <text id="destLabelText" x="0" y="-24" text-anchor="middle" fill="#1C1917" font-size="11" font-weight="800" font-family="-apple-system, sans-serif">THANG MÁY A</text>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- 3. Cụm Nút Điều Khiển Nhỏ Gọn Bên Phải (Chuẩn Google Maps) -->
    <div class="right-map-controls">
      <button id="btnToggleHeading" class="gm-fab" onclick="toggleHeadingMode()" title="Xoay hướng bước đi lên trên">
        <span>↑</span>
        <span class="gm-fab-sub" id="headingSubLabel">Hướng</span>
      </button>

      <button id="btnToggle3D" class="gm-fab" onclick="toggle3DMode()" title="Bật/Tắt góc nghiêng 3D">
        <span id="label3DMode">2D</span>
      </button>

      <button class="gm-fab" onclick="recenterRoute()" title="Căn giữa lộ trình">
        <span style="font-size:13px;">🎯</span>
      </button>

      <div class="gm-zoom-group">
        <button class="gm-zoom-btn" onclick="zoom(0.22)" title="Phóng to">+</button>
        <button class="gm-zoom-btn" onclick="zoom(-0.22)" title="Thu nhỏ">−</button>
      </div>
    </div>

    <!-- 4. Thanh Nổi Phía Dưới Cùng -->
    <div class="bottom-floating-bar">
      <div class="bottom-meta">
        <span class="pulse-dot"></span>
        <span id="expiryTimer">Còn 15:00</span>
      </div>

      <div class="bottom-actions">
        <button id="nextLegQuickBtn" class="pill-next-btn" onclick="switchStep(activeStep === 1 ? 2 : 1)">
          <span id="nextLegBtnText">Chặng 2 →</span>
        </button>
        <button class="pill-close-btn" onclick="finishTicket()">
          <span>✓ Đóng</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Màn Hình Khi Vé Hết Hạn Hoặc Đã Đóng -->
  <div id="expiredScreen">
    <div class="expired-card">
      <div class="expired-icon" id="expiredIcon">⏱️</div>
      <h3 id="expiredTitle" style="font-size:17px; font-weight:800; color:#1C1917;">Chỉ Dẫn Đã Hết Hạn</h3>
      <p id="expiredDesc" style="font-size:13px; color:#78716C; line-height:1.5;">
        Vé chỉ đường này có hiệu lực 15 phút để đảm bảo an ninh và riêng tư. Quý khách vui lòng hỏi lại <strong>Robot Concierge Rora</strong> tại sảnh khách sạn nhé ạ!
      </p>
      <button id="reopenBtn" onclick="reopenTicket()" style="display:none; width:100%; margin-top:6px; padding:11px 14px; border-radius:12px; border:none; background:#1C1917; color:#FAF8F5; font-size:13px; font-weight:700; cursor:pointer;">
        Xem lại bản đồ chỉ dẫn
      </button>
    </div>
  </div>

  <script>
    // Xóa cache Service Worker cũ trên điện thoại để tránh bị kẹt redirect về trang chủ
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.update(); });
        }).catch(function() {});
      }
      if (window.caches) {
        window.caches.keys().then(function(keys) {
          keys.forEach(function(k) {
            if (k !== 'hc-robot-app-cache-v3') window.caches.delete(k);
          });
        }).catch(function() {});
      }
    } catch (e) {}

    // === DỮ LIỆU BẢN ĐỒ & ĐIỂM ĐẾN (Chuẩn hệ tọa độ thống nhất 1840x1174) ===
    const FLOOR_IMAGES = {
      '1': '/maps/floor_b2.png',
      '2': '/maps/floor_b1.png',
      '3': '/maps/floor_1.png',
      '4': '/maps/floor_2.png',
      '5': '/maps/floor_3.png',
      '6': '/maps/floor_4.png',
      '7': '/maps/floor_5.png',
      '8': '/maps/floor_6.png',
    };

    // Chặng 1 chuẩn từ vị trí Robot (x=350, y=580) đến Thang máy A (x=1715, y=560)
    const ROUTE_GROUND_TO_ELEVATOR = 'M 350 580 L 350 860 Q 350 880, 370 880 L 1330 880 Q 1350 880, 1362 864 L 1568 576 Q 1580 560, 1600 560 L 1715 560';

    const DESTINATIONS = {
      // === TẦNG 5: HỒ BƠI, SPA & GYM ===
      infinity_pool: {
        name: 'Hồ Bơi Vô Cực (Infinity Pool)',
        shortLabel: 'HỒ BƠI VÔ CỰC',
        floorId: '7',
        floorLevel: 'TẦNG 5',
        isDiff: true,
        step1: 'Chặng 1: Đi từ sảnh Lobby đến Thang máy A và bấm lên Tầng 5.',
        step2: 'Chặng 2: Ra khỏi thang máy, rẽ trái đi hết hành lang qua cửa kính là đến Hồ bơi vô cực.',
        coords: { x: 380, y: 230 },
        route: 'M 1715 560 L 1005 560 Q 940 560, 900 620 L 870 700 Q 855 745, 820 745 L 680 745 Q 600 745, 600 680 L 600 360 Q 600 270, 520 250 L 380 230'
      },
      gym: {
        name: 'Fitness & Gym Center',
        shortLabel: 'PHÒNG GYM',
        floorId: '7',
        floorLevel: 'TẦNG 5',
        isDiff: true,
        step1: 'Chặng 1: Đi tới Thang máy A và bấm lên Tầng 5.',

    function resolveDestKey(raw) {

    // Tính khung nhìn SVG ViewBox tự động đưa trọng tâm lộ trình về chính giữa màn hình
    function computeSmartRouteFrame(pathStr, startPt, endPt, headingUp) {
      const nums = (pathStr.match(/-?\d+(\.\d+)?/g) || []).map(Number);
      let minX = Math.min(startPt.x, endPt.x);
      let maxX = Math.max(startPt.x, endPt.x);
      let minY = Math.min(startPt.y, endPt.y);
      let maxY = Math.max(startPt.y, endPt.y);

      for (let i = 0; i < nums.length - 1; i += 2) {
        const px = nums[i];
        const py = nums[i + 1];
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
      }

      const midX = Math.round((minX + maxX) / 2);
      const midY = Math.round((minY + maxY) / 2);
      const spanW = Math.max(420, maxX - minX);
      const spanH = Math.max(360, maxY - minY);

      const rotZ = headingUp ? computeOrthogonalHeadingAngle(startPt, endPt) : 0;

      // Khi xoay +-90 độ quanh tâm (midX, midY), bề ngang và bề dọc của lộ trình hoán đổi cho nhau
      const isRotated90 = Math.abs(rotZ) === 90;
      const effSpanW = isRotated90 ? spanH : spanW;
      const effSpanH = isRotated90 ? spanW : spanH;

      // Khoảng đệm xung quanh lộ trình để nhìn rõ các phòng lân cận và toàn bộ đường đi ở giữa màn hình
      const baseW = Math.max(1050, Math.min(1840, effSpanW + 560));
      const baseH = Math.max(950, Math.min(1650, effSpanH + 580));

      return { midX, midY, baseW, baseH, rotZ };
    }

    // Kiểm tra hết hạn vé
    function checkExpiry() {
      const now = Date.now();
      const timeLeft = expiresAt - now;

      if (ticketId && localStorage.getItem('aurora_finished_ticket_' + ticketId)) {
        showExpired(timeLeft > 0);
        return;
      }

      if (timeLeft <= 0) {
        showExpired(false);
        return;
      }

      const m = Math.floor(timeLeft / 60000);
      const s = Math.floor((timeLeft % 60000) / 1000);
      document.getElementById('expiryTimer').innerText = `${dest.time || '2 Phút'} · Còn ${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showExpired(canReopen) {
      document.getElementById('expiredScreen').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
      const titleEl = document.getElementById('expiredTitle');
      const descEl = document.getElementById('expiredDesc');
      const reopenBtn = document.getElementById('reopenBtn');
      if (canReopen) {
        if (titleEl) titleEl.innerText = 'Đã Đóng Chỉ Dẫn Đường Đi';
        if (descEl) descEl.innerHTML = 'Bạn đã xác nhận nhớ lộ trình tới <strong>' + dest.name + '</strong>. Nếu lỡ tay bấm đóng, bạn có thể mở lại ngay bên dưới.';
        if (reopenBtn) reopenBtn.style.display = 'block';
      } else {
        if (titleEl) titleEl.innerText = 'Chỉ Dẫn Đã Hết Hạn';
        if (descEl) descEl.innerHTML = 'Vé chỉ đường này có hiệu lực 15 phút để đảm bảo an ninh và riêng tư. Quý khách vui lòng hỏi lại <strong>Robot Concierge Rora</strong> tại sảnh khách sạn nhé ạ!';
        if (reopenBtn) reopenBtn.style.display = 'none';
      }
    }

    function finishTicket() {
      if (ticketId) {
        localStorage.setItem('aurora_finished_ticket_' + ticketId, '1');
      }
      showExpired(expiresAt > Date.now());
    }

    function reopenTicket() {
      if (ticketId) {
        localStorage.removeItem('aurora_finished_ticket_' + ticketId);
      }
      document.getElementById('expiredScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      checkExpiry();
    }

    function render() {
      document.getElementById('destNameHeader').innerText = dest.name;
      document.getElementById('destFloorBadge').innerText = dest.floorLevel;

      if (!dest.isDiff) {
        document.getElementById('stepSwitcher').style.display = 'none';
        document.getElementById('nextLegQuickBtn').style.display = 'none';
        activeStep = 2;
      }

      updateStepView();
    }

    function getActiveLegPoints() {
      if (activeStep === 1) {
        return {
          path: ROUTE_GROUND_TO_ELEVATOR,
          start: { x: 350, y: 580 },
          end: { x: 1715, y: 560 },
          startLabel: 'BẠN Ở ĐÂY',
          endLabel: 'THANG MÁY A'
        };
      }
      const startPt = dest.isDiff ? { x: 1715, y: 560 } : { x: 350, y: 580 };
      return {
        path: dest.route,
        start: startPt,
        end: dest.coords,
        startLabel: dest.isDiff ? 'RA THANG MÁY' : 'BẠN Ở ĐÂY',
        endLabel: dest.shortLabel || dest.name.toUpperCase().slice(0, 16)
      };
    }

    function updateStepView() {
      const btn1 = document.getElementById('btnStep1');
      const btn2 = document.getElementById('btnStep2');
      const floorImg = document.getElementById('floorImage');
      const floorBadge = document.getElementById('floorBadge');
      const halo = document.getElementById('svgHalo');
      const track = document.getElementById('svgTrack');
      const route = document.getElementById('svgRoute');
      const walkerMotion = document.getElementById('walkerMotion');
      const startPinGroup = document.getElementById('startPinGroup');
      const destPinGroup = document.getElementById('destPinGroup');
      const startLabelText = document.getElementById('startLabelText');
      const destLabelText = document.getElementById('destLabelText');
      const instNum = document.getElementById('currentStepIcon');
      const instText = document.getElementById('stepInstructionText');
      const nextLegBtnText = document.getElementById('nextLegBtnText');

      const leg = getActiveLegPoints();

      if (activeStep === 1) {
        btn1.classList.add('active');
        btn2.classList.remove('active');
        floorImg.setAttribute('href', FLOOR_IMAGES['3']);
        floorBadge.innerText = 'SẢNH TRỆT';
        instNum.innerText = '1';
        instText.innerText = dest.step1 || 'Đi từ sảnh Lobby đến Thang máy A và bấm lên tầng mục tiêu.';
        if (nextLegBtnText) nextLegBtnText.innerText = 'Chặng 2 →';
      } else {
        btn2.classList.add('active');
        btn1.classList.remove('active');
        floorImg.setAttribute('href', FLOOR_IMAGES[dest.floorId] || `/maps/floor_${dest.floorId}.png`);
        floorBadge.innerText = dest.floorLevel;
        instNum.innerText = dest.isDiff ? '2' : '1';
        instText.innerText = (dest.isDiff ? dest.step2 : dest.step1) || `Ra khỏi thang máy, đi theo chỉ dẫn tới ${dest.name}.`;
        if (nextLegBtnText) nextLegBtnText.innerText = '← Chặng 1';
      }

      halo.setAttribute('d', leg.path);
      track.setAttribute('d', leg.path);
      route.setAttribute('d', leg.path);
      if (walkerMotion) {
        walkerMotion.setAttribute('path', leg.path);
      }

      startPinGroup.setAttribute('transform', `translate(${leg.start.x}, ${leg.start.y})`);
      destPinGroup.setAttribute('transform', `translate(${leg.end.x}, ${leg.end.y})`);
      startLabelText.textContent = leg.startLabel;
      destLabelText.textContent = leg.endLabel;

      recenterRoute();
    }

    function updateControlButtonsUI() {
      const btnHeading = document.getElementById('btnToggleHeading');
      const btn3D = document.getElementById('btnToggle3D');
      const label3D = document.getElementById('label3DMode');
      const stage3D = document.getElementById('map3dStage');

      if (btnHeading) btnHeading.classList.toggle('active', isHeadingUp);
      if (btn3D) btn3D.classList.toggle('active', is3D);
      if (label3D) label3D.innerText = is3D ? '3D' : '2D';
      if (stage3D) stage3D.classList.toggle('tilt-3d', is3D);
    }

    function toggleHeadingMode() {
      isHeadingUp = !isHeadingUp;
      updateControlButtonsUI();
      recenterRoute();
    }

    function toggle3DMode() {
      is3D = !is3D;
      updateControlButtonsUI();
    }

    function recenterRoute() {
      const leg = getActiveLegPoints();
      currentFrame = computeSmartRouteFrame(leg.path, leg.start, leg.end, isHeadingUp);
      userZoom = 1.0;
      panSvgX = 0;
      panSvgY = 0;
      applySvgCamera();
    }

    function switchStep(step) {
      activeStep = step;
      updateStepView();
    }

    function zoom(delta) {
      userZoom = Math.min(2.6, Math.max(0.65, Number((userZoom + delta).toFixed(2))));
      applySvgCamera();
    }

    function applySvgCamera() {
      const svgEl = document.getElementById('mainMapSvg');
      const worldGroup = document.getElementById('svgWorldGroup');
      const startInner = document.getElementById('startLabelInner');
      const destInner = document.getElementById('destLabelInner');

      const vbW = Math.round(currentFrame.baseW / userZoom);
      const vbH = Math.round(currentFrame.baseH / userZoom);
      const vbX = Math.round(currentFrame.midX - vbW / 2 - panSvgX);
      const vbY = Math.round(currentFrame.midY - vbH / 2 - panSvgY);

      if (svgEl) {
        svgEl.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
      }

      // Xoay quanh tâm lộ trình (midX, midY) ngay trong không gian 1:1 của SVG -> Không bao giờ méo hình
      if (worldGroup) {
        worldGroup.setAttribute(
          'transform',
          `rotate(${currentFrame.rotZ} ${currentFrame.midX} ${currentFrame.midY})`
        );
      }

      // Giữ nhãn ghim luôn nằm ngang dễ đọc
      if (startInner) startInner.setAttribute('transform', `rotate(${-currentFrame.rotZ})`);
      if (destInner) destInner.setAttribute('transform', `rotate(${-currentFrame.rotZ})`);
    }

    // Kéo bản đồ trực tiếp trên toàn màn hình (1 ngón tay / chuột)
    const mapContainer = document.getElementById('mapContainer');
    mapContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startPanSvgX = panSvgX;
      startPanSvgY = panSvgY;
      try { mapContainer.setPointerCapture(e.pointerId); } catch (_) {}
    });

    mapContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const cw = mapContainer.clientWidth || 375;
      const scaleSvgPerPx = (currentFrame.baseW / userZoom) / cw;
      const dx = (e.clientX - dragStartX) * scaleSvgPerPx;
      const dy = (e.clientY - dragStartY) * scaleSvgPerPx;
      panSvgX = Math.max(-950, Math.min(950, startPanSvgX + dx));
      panSvgY = Math.max(-750, Math.min(750, startPanSvgY + dy));
      applySvgCamera();
    });

    const stopDrag = (e) => {
      if (isDragging) {
        isDragging = false;
        try { mapContainer.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    };
    mapContainer.addEventListener('pointerup', stopDrag);
    mapContainer.addEventListener('pointercancel', stopDrag);

    // Khởi tạo
    updateControlButtonsUI();
    render();
    checkExpiry();
    setInterval(checkExpiry, 1000);
  </script>
</body>
</html>
