# Saved-map Gazebo navigation: finish the final heading before considering
# the short remaining path. Otherwise replanning can alternate rotation-shim
# path alignment with DWB RotateToGoal, producing zero-forward oscillation.
amcl:
  ros__parameters:
    # Gazebo has a known spawn; the simulator script also sends /initialpose.
    set_initial_pose: true
controller_server:
  ros__parameters:
    FollowPath:
      rotate_to_goal_heading: true
