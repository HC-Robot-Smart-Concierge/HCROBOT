amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      # Xoay tai cho (cat xung 0.2 s quay / 0.5 s dung khi quet map) khong tinh la tien;
      # quay 180 do mat ~7-8 s nen 10 s qua sat.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      # Xoay tai cho ve huong duong di truoc (lech > ~30 do), roi moi giao cho DWB bam
      # duong. Xe that (skid-steer) chi chay duoc xoay tai cho hoac di thang, khong
      # lan duoc cung PWM thap DWB hay phat luc xuat phat lech huong.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.5
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Xe that: SLAM chi cap nhat TF map->odom khi co scan, ma bridge BO scan khi xe quay
      # > 15 do/s (chong meo map) -> quay ~2 s khong co scan, TF cu ~2-2.5 s. Nho hon thi
      # controller bao "Transform data too old" va huy dich ngay sau lan quay dau.
      # An toan: vi tri xe van lay tu odom (encoder+gyro 30 Hz); chi phan hieu chinh
      # map->odom (thay doi rat cham) duoc phep cu toi 3 s.
      # Tu quet xe that: xoay tai cho cat xung (0.2 s quay / 0.5 s dung), quay 90 do ~4 s va
      # scan bi bo het trong luc do => TF map->odom cu toi ~4-5 s. 3.0 thi controller huy
      # duong ("Transform data too old") giua luc xoay. Vi tri xe van lay tu odom 30 Hz.
      transform_tolerance: 6.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.025
      # Xe that dai 0.33 m x rong 0.17 m (ke ca banh); base_link o tam xoay.
      footprint: "[[0.165, 0.085], [0.165, -0.085], [-0.165, -0.085], [-0.165, 0.085]]"
      # Bien an toan: Pi (sonar) chan xoay/re khi hong xe < 12 cm. Khong padding thi
      # Nav2 lap duong sat tuong, xe ket vi moi lenh xoay bi chan (xem settings.yaml).
      # Da thu 0.06 de qua khe hep: xe ket o khe (Pi chan xoay) -> giu 0.13.
      footprint_padding: 0.13
      transform_tolerance: 6.0   # mac dinh 0.3; TF map->odom cu toi ~4-5 s khi xe xoay (xem controller_server)
      plugins:
      - obstacle_layer
      - inflation_layer
      # Vung KEEP_OUT tu Web Admin (mask do filter_mask_server phat, xem keepout_filter_params.yaml)
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          inf_is_valid: true
        plugin: nav2_costmap_2d::ObstacleLayer
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Xe that dai 0.33 m x rong 0.17 m (ke ca banh); base_link o tam xoay.
      footprint: "[[0.165, 0.085], [0.165, -0.085], [-0.165, -0.085], [-0.165, 0.085]]"
      # Bien an toan: Pi (sonar) chan xoay/re khi hong xe < 12 cm. Khong padding thi
      # Nav2 lap duong sat tuong, xe ket vi moi lenh xoay bi chan (xem settings.yaml).
      # Da thu 0.06 de qua khe hep: xe ket o khe (Pi chan xoay) -> giu 0.13.
      footprint_padding: 0.13
      transform_tolerance: 6.0   # mac dinh 0.3; TF map->odom cu toi ~4-5 s khi xe xoay (xem controller_server)
      resolution: 0.025
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      # Vung KEEP_OUT tu Web Admin => planner khong lap duong di vao
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          inf_is_valid: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # Global planner (NavFn) ne vung co chi phi => duong di nam giua loi di, cach tuong
        # ~0.5 m khi du rong, de xe xoay duoc o cac goc (sat tuong thi Pi chan xoay).
        # Khong lam hep loi di: van qua duoc khe > 0.42 m (chi la dat hon).
        inflation_radius: 0.55
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    transform_tolerance: 6.0     # mac dinh 0.1; TF map->odom cu toi ~4-5 s khi xe xoay
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
