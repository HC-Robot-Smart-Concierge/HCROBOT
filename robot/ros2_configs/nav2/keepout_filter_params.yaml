# Keepout Filter cho Nav2: vung KEEP_OUT ve tren Web Admin -> mask (robot/maps/keepout/<map>.yaml)
# -> costmap global/local danh dau la vat can (xem keepout_filter trong nav2_params.yaml).
# Mask duoc backend tao lai moi khi bat Navigation tu Web hoac khi luu vung.
filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""   # truyen qua -p yaml_filename:=... trong start_wsl_navigation.sh

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0             # 0 = KeepoutFilter
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
