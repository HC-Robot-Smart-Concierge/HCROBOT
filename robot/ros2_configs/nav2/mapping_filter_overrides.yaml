# Real-robot mapping: measured 33 x 17 cm body with 4 cm collision padding.
# Applied only with slam:=true. Static-map navigation retains its configuration.
controller_server:
  ros__parameters:
    FollowPath:
      critics: [RotateToGoal, Oscillation, BaseObstacle, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.04
      keepout_filter:
        enabled: false
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.04
      keepout_filter:
        enabled: false
      speed_filter:
        enabled: false
