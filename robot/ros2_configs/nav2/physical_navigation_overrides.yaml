# Saved-map navigation of the measured 33 x 17 cm robot; keepout stays enabled.
amcl:
  ros__parameters:
    # true: AMCL tam dat xe o initial_pose (0,0,0) de co frame map ngay. false thi global
    # costmap cho TF map qua lau va lifecycle manager HUY Nav2 (~12 s) truoc khi kip dat vi tri
    # tren Web (test 08/11). (0,0,0) khong chac la Dock nhung KHONG nguy hiem: localization_manager
    # chan moi goal toi khi co /initialpose (Web/khoi phuc pose cu) VA LiDAR khop map.
    set_initial_pose: true
    # Correct small motions before a 10 cm / 6 degree error reaches costmaps.
    update_min_d: 0.025
    update_min_a: 0.04
    max_beams: 120
    # Small indoor maps need a more discriminating wall likelihood than a
    # 2 m field with 50% random hits. These are starting values for field tuning.
    laser_likelihood_max_dist: 0.5
    sigma_hit: 0.15
    z_hit: 0.85
    z_rand: 0.15
controller_server:
  ros__parameters:
    FollowPath:
      critics: [RotateToGoal, Oscillation, BaseObstacle, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      # Xe that (cmd_vel mode "straight"): vua chay vua cua chi quay ~5 do/s (log 07/11:
      # Nav2 w=-0.8 -> drive:49:35 -> do 3-8 do/s), xoay tai cho ~24 do/s. Voi 0.8 rad/s
      # DWB chon cung gat xe khong theo kip -> lech duong, ca hong vao vat can, ket.
      # Gioi han cung DWB ve muc xe lam duoc; re > ~20 do thi RotationShim xoay tai cho.
      max_vel_theta: 0.15
      angular_dist_threshold: 0.35
      # Demo vung giam toc (10/11): binh thuong 0.25 m/s, vung giam toc 0.12 m/s (san motor, cham
      # hon khong lan deu) => trong vung con mot nua toc do, nhin thay ro. Bridge: tran PWM 72%.
      max_vel_x: 0.25
      max_speed_xy: 0.25
local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.04
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.04
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
