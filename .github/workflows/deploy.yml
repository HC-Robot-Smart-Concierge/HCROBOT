name: HC-Robot Production Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: 🚀 Production Release Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Build Frontend Asset Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: 📁 Archive Release Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: frontend/dist/
          retention-days: 7
