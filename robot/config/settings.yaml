server:
  # Địa chỉ IP của Laptop Server (Ưu tiên dùng IP Tailscale dạng 100.x.y.z để cố định IP)
  host: "100.x.y.z" 
  port: 8000
  timeout_seconds: 15

robot:
  id: "hc_pi5_01"
  name: "HC Smart Concierge Robot"
  gpio:
    left_forward: 17
    left_backward: 27
    right_forward: 22
    right_backward: 23

topics:
  speech_input: "/speech/text"
  speech_reply: "/robot/speech_reply"
  robot_status: "/robot/status"
  intent_output: "/robot/intent"
  cmd_vel: "/cmd_vel"


