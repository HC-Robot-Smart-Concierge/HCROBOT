# Cấu hình Robot HC-Robot trên Raspberry Pi 5

robot:
  id: "hc_pi5_01"
  name: "Rora Smart Concierge Robot"
  gpio:
    # Tự phát hiện gpiochip RP1. Chỉ bỏ comment khi cần ép chip cụ thể:
    # chip: 4

    # L298N Channel A (hai motor trái mắc song song vào OUT1 & OUT2):
    left_forward: 17     # GPIO17 -> IN1
    left_backward: 27    # GPIO27 -> IN2

    # L298N Channel B (hai motor phải mắc song song vào OUT3 & OUT4):
    right_forward: 22    # GPIO22 -> IN3
    right_backward: 23   # GPIO23 -> IN4

    # Đảo chiều motor để tiến đúng hướng FRONT của robot (phía ngược dây cáp LiDAR).
    # Kiểm tra bằng: sudo python3 main.py --drive-test forward (kê bánh lên trước).
    # Cả hai bên quay lùi -> đảo cả hai cờ; chỉ một bên quay lùi -> đảo cờ bên đó.
    invert_left_direction: false
    invert_right_direction: true

  ultrasonic_serial:
    port: "auto"          # Hoặc /dev/ttyUSB0, /dev/ttyACM0
    baudrate: 115200

  safety:
    # Sonar là lớp PHANH KHẨN CẤP cuối cùng; tránh vật cản thường ngày do Nav2 + LiDAR lo.
    # Ngưỡng lấy theo hình học thật của xe (dài 32 x rộng 16 cm, xoay quanh tâm: góc xe
    # quét bán kính ~17.9 cm = lố ~10 cm ra ngoài hông, ~2 cm ra ngoài đầu/đuôi) + chút dư.
    # Ngưỡng to hơn mức xe thật cần => Pi chặn lệnh Nav2 cho là an toàn => xe đứng yên
    # tới hết timeout (log 05/11: trước 27 < 30 chặn tiến, phải 18 < 20 chặn xoay...).
    front_stop_cm: 15
    rear_stop_cm: 12
    # Hông chỉ dùng khi XOAY / rẽ một bên (góc xe lố ~10 cm ra ngoài hông).
    left_stop_cm: 11
    right_stop_cm: 11
    # Khi quay tại chỗ: ngoài bên quay, đầu/đuôi xe phải trống hơn mức này.
    turn_clearance_cm: 6

    # Cho phép tối đa 4 packet null nếu số đo hợp lệ gần nhất chưa quá 0.6 giây.
    allowed_null_packets: 4
    invalid_grace_seconds: 0.6
    stale_timeout_seconds: 0.8

    # Sau khi bị chặn, chỉ cần 2 packet sạch cao hơn ngưỡng dừng 2 cm.
    resume_margin_cm: 2
    resume_valid_packets: 2

topics:
  cmd_vel: "/cmd_vel"
  cmd_text: "/robot/cmd_text"
